
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering Portal - Register</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e1b4b,#0b1220);
            color:#e2e8f0;
            overflow:hidden;
        }

        .register-card{
            width:100%;
            max-width:450px;
            padding:40px 30px;
            border-radius:22px;
            background:rgba(15,23,42,0.85);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.08);
            box-shadow:0 25px 60px rgba(0,0,0,0.6);
            animation:fadeIn 0.6s ease;
            text-align:center;
        }

        @keyframes fadeIn{
            from{opacity:0; transform:translateY(20px);}
            to{opacity:1; transform:translateY(0);}
        }

        .portal-title{
            font-size:20px;
            font-weight:bold;
            color:#cbd5e1;
            margin-bottom:10px;
        }

        .welcome-title{
            font-size:28px;
            color:white;
            font-weight:700;
            margin-bottom:6px;
        }

        .subtitle{
            font-size:14px;
            color:#94a3b8;
            margin-bottom:25px;
        }

        .error-msg{
            background:rgba(239,68,68,0.15);
            border:1px solid rgba(239,68,68,0.3);
            color:#fecaca;
            padding:10px;
            border-radius:12px;
            margin-bottom:15px;
        }

        .form-group{
            position:relative;
            margin-bottom:18px;
        }

        .form-group input{
            width:100%;
            padding:14px 14px 14px 45px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.1);
            background:rgba(255,255,255,0.05);
            color:white;
            outline:none;
            transition:0.3s;
        }

        .form-group input::placeholder{
            color:#94a3b8;
        }

        .form-group input:focus{
            border-color:#7c3aed;
            box-shadow:0 0 12px rgba(124,58,237,0.3);
            background:rgba(255,255,255,0.07);
        }

        .form-group::before{
            position:absolute;
            left:14px;
            top:12px;
            font-size:18px;
            color:#cbd5e1;
        }

        .user-icon::before{ content:"👤"; }
        .pass-icon::before{ content:"🔒"; }

        .btn-register{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg,#7c3aed,#2563eb);
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        .btn-register:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(124,58,237,0.4);
        }

        .login-link{
            margin-top:20px;
            font-size:14px;
            color:#cbd5e1;
        }

        .login-link a{
            color:#a78bfa;
            text-decoration:none;
            font-weight:600;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        .footer-text{
            margin-top:25px;
            font-size:12px;
            color:#64748b;
            border-top:1px solid rgba(255,255,255,0.08);
            padding-top:15px;
        }

        @media(max-width:500px){
            .register-card{
                margin:20px;
                padding:30px 20px;
            }
        }

    </style>
</head>

<body>

    <div class="register-card">

        <div class="portal-title">🍽️ Catering Portal</div>

        <h2 class="welcome-title">Create Account</h2>
        <p class="subtitle">Join us and start your journey</p>

        
                <div class="error-msg" id="alertMsg">{{ message }}</div>

        <form action="{% url 'register' %}" method="POST">
           

            <div class="form-group user-icon">
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="form-group pass-icon">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <div class="form-group pass-icon">
                <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn-register">Register</button>
        </form>

        <div class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </div>

        <div class="footer-text">
            © 2026 Catering Portal
        </div>

    </div>

    <script>
        const alertMsg = document.getElementById('alertMsg');
        if(alertMsg){
            setTimeout(()=>{
                alertMsg.style.opacity="0";
                setTimeout(()=>alertMsg.remove(),500);
            },3500);
        }
    </script>

</body>
</html>
