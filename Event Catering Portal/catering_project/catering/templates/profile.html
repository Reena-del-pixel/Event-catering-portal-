{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Catering Portal</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e1b4b,#0b1220);
            color:#e2e8f0;
        }

        .navbar{
            background:rgba(2,6,23,0.75);
            backdrop-filter:blur(12px);
            padding:15px 50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .navbar strong{
            color:white;
            font-size:18px;
        }

        .navbar a{
            color:#cbd5e1;
            text-decoration:none;
            transition:0.3s;
            font-weight:500;
        }

        .navbar a:hover{
            color:#a78bfa;
        }

        .container{
            min-height:calc(100vh - 70px);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px 20px;
        }

        .card{
            width:100%;
            max-width:420px;
            background:rgba(15,23,42,0.85);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:22px;
            padding:40px 30px;
            text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,0.6);
            backdrop-filter:blur(18px);
            animation:fadeIn 0.6s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .circle{
            width:90px;
            height:90px;
            border-radius:50%;
            margin:0 auto 20px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:42px;
            background:linear-gradient(135deg,#7c3aed,#2563eb);
            box-shadow:0 10px 30px rgba(124,58,237,0.3);
        }

        h2{
            margin-bottom:25px;
            font-size:24px;
            color:#ffffff;
        }

        .info{
            text-align:left;
            line-height:2.2;
            background:rgba(255,255,255,0.03);
            padding:18px;
            border-radius:14px;
            border:1px solid rgba(255,255,255,0.06);
        }

        .info p{
            color:#cbd5e1;
            font-size:15px;
        }

        .info strong{
            color:#ffffff;
        }

    </style>
</head>

<body>

    <div class="navbar">
        <strong>🍽️ Catering Portal</strong>
        <a href="{% url 'home' %}">Home</a>
    </div>

    <div class="container">

        <div class="card">

            <div class="circle">👤</div>

            <h2>My Profile</h2>

            <div class="info">
                <p><strong>Username:</strong> {{ user.username }}</p>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Joined:</strong> {{ user.date_joined|date:"d M Y" }}</p>
            </div>

        </div>

    </div>

</body>
</html>
