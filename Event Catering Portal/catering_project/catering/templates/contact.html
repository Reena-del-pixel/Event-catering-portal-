{% load static %}
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering Portal - Contact</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e1b4b,#020617);
            color:#e2e8f0;
        }

        header{
            background:rgba(2,6,23,0.8);
            backdrop-filter:blur(12px);
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid rgba(255,255,255,0.08);
            position:sticky;
            top:0;
        }

        .logo{
            color:white;
            font-size:22px;
            font-weight:700;
            text-decoration:none;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:18px;
            align-items:center;
        }

        nav ul li a{
            color:#cbd5e1;
            text-decoration:none;
            font-weight:500;
            transition:0.3s;
        }

        nav ul li a:hover{
            color:#a78bfa;
        }

        .container{
            max-width:1100px;
            margin:50px auto;
            padding:0 20px;
            display:flex;
            gap:25px;
            flex-wrap:wrap;
            justify-content:center;
        }

        .card{
            flex:1;
            min-width:300px;
            padding:30px;
            border-radius:18px;
            background:rgba(15,23,42,0.85);
            border:1px solid rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            box-shadow:0 20px 50px rgba(0,0,0,0.5);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        h3{
            margin-bottom:15px;
            color:#ffffff;
            font-size:20px;
        }

        input,textarea{
            width:100%;
            padding:12px;
            margin-top:10px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.1);
            background:rgba(255,255,255,0.05);
            color:white;
            outline:none;
        }

        input:focus,textarea:focus{
            border-color:#7c3aed;
            box-shadow:0 0 10px rgba(124,58,237,0.3);
        }

        .btn{
            margin-top:15px;
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#7c3aed,#2563eb);
            color:white;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(124,58,237,0.4);
        }

        .info{
            line-height:2;
            font-size:15px;
            color:#e2e8f0;
        }

        .highlight-card{
            background:linear-gradient(135deg,#7c3aed,#2563eb);
        }

    </style>
</head>

<body>

<header>
    <a href="{% url 'home' %}" class="logo">🍽️ Catering Portal</a>
    <nav>
        <ul>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'my_bookings' %}">My Bookings</a></li>
            <li><a href="{% url 'profile' %}">Profile</a></li>
            <li><a href="{% url 'about_us' %}">About</a></li>
            <li><a href="{% url 'logout' %}">Logout</a></li>
        </ul>
    </nav>
</header>

<div class="container">

    <div class="card">
        <h3>Contact Us</h3>

        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea rows="4" placeholder="Your Message"></textarea>

        <button class="btn">Send Message</button>
    </div>

    <div class="card highlight-card">
        <h3>Get in Touch</h3>
        <div class="info">
            📍 Pragati Nagar Camp-1, Bhilai Durg, C.G<br>
            📞 +91 9876543210<br>
            ✉️ info@cateringportal.com<br>
            🕒 24/7 Support Available
        </div>
    </div>

</div>

</body>
</html>
